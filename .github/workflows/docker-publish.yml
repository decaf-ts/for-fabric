name: "Docker Publish"

# Thin caller of decaf-ts/reusable-actions/.github/workflows/docker-publish.yml.
# Builds and publishes this repo's docker image(s) to ghcr.io, running in
# parallel with publish-on-release (npm) on every GitHub Release. Also
# triggerable on demand from the Actions UI with the inputs below.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version-tag:
        description: "Explicit version for the versioned tag. Empty = read from package.json."
        required: false
        default: ""
      push:
        description: "Push the built image to the registry (false = build only)."
        type: boolean
        required: false
        default: true
      platforms:
        description: "Platforms to build (buildx format, e.g. linux/amd64,linux/arm64)."
        required: false
        default: "linux/amd64"
      no-cache:
        description: "Build with --no-cache."
        type: boolean
        required: false
        default: true

jobs:
  docker-contracts:
    name: Docker contracts
    uses: decaf-ts/reusable-actions/.github/workflows/docker-publish.yml@master
    with:
      image: decaf-ts/for-fabric
      dockerfile: docker/images/Dockerfile-contract
      context: .
      tag-prefix: "contract-"
      floating-tag: latest
      version-tag: ${{ inputs.version-tag }}
      push: ${{ inputs.push != false }}
      platforms: ${{ inputs.platforms || 'linux/amd64' }}
      no-cache: ${{ inputs.no-cache != false }}
      mount-npm-token: true
      pre-build-command: "npm ci && npm run build:contract:docker"
    secrets: inherit
