services:
  org-tls:
    container_name: ${ORG_NAME}-tls
    hostname: ${ORG_NAME}-tls
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - tls
    environment:
      - FABRIC_CA_SERVER_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_CLIENT_HOME=/etc/hyperledger/client/admin
      - FABRIC_CA_CLIENT_TLS_CERTFILES=/etc/hyperledger/fabric-ca-server/tls-ca.crt
    labels:
      - "pla_mah_index_name=${ORG_NAME}"
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    working_dir: /etc/hyperledger/fabric-ca-server
    volumes:
      - org-tls-server-vol:/etc/hyperledger/fabric-ca-server:rw
      - org-tls-client-vol:/etc/hyperledger/client:rw
      - org-tls-shared-vol:/etc/hyperledger/shared:rw
      - org-ca-tls-vol:/etc/hyperledger/ca/tls:rw
    networks:
      org_network:
    healthcheck:
      test: bash -c "[ -f
        /etc/hyperledger/fabric-ca-server/fabric-ca-server-config.yaml ] && curl
        -s ${OPERATIONS_ADDRESS}/healthz | grep "OK" || exit 1"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: sh -c 'fabric-ca-server start -d'

  org-ca:
    container_name: ${ORG_NAME}-ca
    hostname: ${ORG_NAME}-ca
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - ca
    environment:
      - FABRIC_CA_SERVER_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_CLIENT_HOME=/etc/hyperledger/client/client
      - FABRIC_CA_CLIENT_TLS_CERTFILES=/etc/hyperledger/shared/tls-cert.pem
    labels:
      - "pla_mah_index_name=${ORG_NAME}"
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    working_dir: /etc/hyperledger/fabric-ca-server
    networks:
      org_network:
    volumes:
      - org-tls-shared-vol:/etc/hyperledger/shared:rw
      - org-ca-server-vol:/etc/hyperledger/fabric-ca-server:rw
      - org-ca-client-vol:/etc/hyperledger/client:rw
      - org-ca-tls-vol:/etc/hyperledger/tls:rw
      - org-msp-vol:/etc/hyperledger/org-msp:rw
      - org-peer-0-vol:/etc/hyperledger/client/peers/peer-0:rw
      - org-ccaas-tls-vol:/etc/hyperledger/ccaas:rw
    healthcheck:
      test: bash -c "[ -f
        /etc/hyperledger/fabric-ca-server/fabric-ca-server-config.yaml ] && curl
        -s ${OPERATIONS_ADDRESS}/healthz | grep "OK" || exit 1"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: sh -c 'fabric-ca-server start -d'

  org-peer-0-couchdb:
    container_name: ${ORG_NAME}-peer-0-couchdb
    hostname: ${ORG_NAME}-peer-0-couchdb
    restart: unless-stopped
    profiles:
      - peer-0-couchdb
    image: ${COUCHDB_IMAGE-none}
    environment:
      COUCHDB_USER: ${COUCHDB_USER-none}
      COUCHDB_PASSWORD: ${COUCHDB_SECRET-none}
    labels:
      - "pla_mah_index_name=${ORG_NAME}"
    volumes:
      - org-peer-0-couchdb-vol:/opt/couchdb/data
    networks:
      org_network:
    ports:
      - ${COUCHDB_PORT-8000}:5984
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: curl -f http://localhost:5984/ || exit 1
      interval: 3s
      timeout: 3s
      retries: 10

  org-peer-0:
    container_name: ${ORG_NAME}-peer-0
    hostname: ${ORG_NAME}-peer-0
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - peer-0
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric/ca
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/ca/msp
      - FABRIC_LOGGING_SPEC=gateway=debug:comm=debug:grpc=debug
    labels:
      - "pla_mah_index_name=${ORG_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - org-tls-shared-vol:/etc/hyperledger/shared:rw
      - org-peer-0-vol:/etc/hyperledger/fabric:rw
      - org-peer-0-general-vol:/var/hyperledger:rw
      - org-contracts-vol:/etc/hyperledger/contract:rw
    networks:
      org_network:
      pla_network:
    healthcheck:
      test: bash -c "[ -f /etc/hyperledger/fabric/ca/core.yaml ] && curl -s
        ${OPERATIONS_ADDRESS}/healthz | grep "OK" || exit 1"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: peer node start

  org-ccaas:
    container_name: ${ORG_NAME}-ccaas-${CONTRACT_NAME}
    hostname: ${ORG_NAME}-ccaas-${CONTRACT_NAME}
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - ccaas
    volumes:
      - org-ccaas-tls-vol:/opt/hyperledger/tls:rw
      - org-contracts-vol:/weaver/contract:rw
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:${PORT:-9999}
      - CHAINCODE_ID=${PACKAGE_ID:-none}
      - CHAINCODE_TLS_CERT=/opt/hyperledger/tls/tls-client-cert.pem
      - CHAINCODE_TLS_KEY=/opt/hyperledger/tls/tls-client-key.pem
      - CORE_CHAINCODE_LOGGING_LEVEL=${LOG_LEVEL:-debug}
      - CORE_CHAINCODE_LOGGING_SHIM=${LOG_LEVEL:-debug}
      - CHAINCODE_MAXRECVMSGSIZE=${CHAINCODE_MAXRECVMSGSIZE:-15728640}
      - CHAINCODE_MAXSENDMSGSIZE=${CHAINCODE_MAXSENDMSGSIZE:-15728640}
    networks:
      org_network:
    command: npm run start

  org-ccaas-on-prem:
    container_name: ${ORG_NAME}-ccaas-${CONTRACT_NAME}
    hostname: ${ORG_NAME}-ccaas-${CONTRACT_NAME}
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - ccaas-on-prem
    volumes:
      - org-ccaas-tls-vol:/opt/hyperledger/tls:rw
      - org-contracts-vol:/weaver/contract:rw
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:${PORT:-9999}
      - CHAINCODE_ID=${PACKAGE_ID:-none}
      - CHAINCODE_TLS_CERT=/opt/hyperledger/tls/tls-client-cert.pem
      - CHAINCODE_TLS_KEY=/opt/hyperledger/tls/tls-client-key.pem
      - CORE_CHAINCODE_LOGGING_LEVEL=${LOG_LEVEL:-debug}
      - CORE_CHAINCODE_LOGGING_SHIM=${LOG_LEVEL:-debug}
      - CHAINCODE_MAXRECVMSGSIZE=${CHAINCODE_MAXRECVMSGSIZE:-15728640}
      - CHAINCODE_MAXSENDMSGSIZE=${CHAINCODE_MAXSENDMSGSIZE:-15728640}
    networks:
      org_network:
    command: npm run start

  org-tools:
    container_name: ${ORG_NAME}-tools
    hostname: ${ORG_NAME}-tools
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - tools
    environment:
      - CORE_CHAINCODE_LOGGING_LEVEL=${LOG_LEVEL:-debug}
      - CORE_CHAINCODE_LOGGING_SHIM=${LOG_LEVEL:-debug}
    labels:
      - "pla_mah_index_name=${ORG_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - org-tls-server-vol:/weaver/tls/server:rw
      - org-ca-server-vol:/weaver/ca/server:rw
      - org-tls-shared-vol:/weaver/shared:rw
      - org-contracts-vol:/weaver/contract:rw
    networks:
      org_network:
    healthcheck:
      test: bash -c "[ -f /weaver/lib/core/cli.cjs ]"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: tail -f /dev/null

networks:
  org_network:
    name: ${ORG_NAME}_network
    driver: bridge

  pla_network:
    name: ${PLA_ORG_NAME}_network
    external: true
    driver: bridge

volumes:
  org-tls-server-vol:
    name: ${ORG_NAME}-tls-server-vol
  org-tls-client-vol:
    name: ${ORG_NAME}-tls-client-vol
  org-tls-shared-vol:
    name: ${ORG_NAME}-tls-shared-vol

  org-ca-tls-vol:
    name: ${ORG_NAME}-ca-tls-vol
  org-ca-server-vol:
    name: ${ORG_NAME}-ca-server-vol
  org-ca-client-vol:
    name: ${ORG_NAME}-ca-client-vol

  org-msp-vol:
    name: ${ORG_NAME}-msp-vol

  org-peer-0-couchdb-vol:
    name: ${ORG_NAME}-peer-0-couchdb-vol

  org-peer-0-vol:
    name: ${ORG_NAME}-peer-0-vol
  org-peer-0-general-vol:
    name: ${ORG_NAME}-peer-0-general-vol

  org-ccaas-tls-vol:
    name: ${ORG_NAME}-ccaas-tls-vol

  org-contracts-vol:
    name: ${ORG_NAME}-contracts-vol
