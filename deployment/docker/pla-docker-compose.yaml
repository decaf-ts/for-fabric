  org-peer-1-couchdb-vol:
    name: ${ORG_NAME}-peer-1-couchdb-vol
  org-peer-2-couchdb-vol:
    name: ${ORG_NAME}-peer-2-couchdb-vol

  org-peer-0-vol:
    name: ${ORG_NAME}-peer-0-vol
  org-peer-0-general-vol:
    name: ${ORG_NAME}-peer-0-general-vol

  org-peer-1-vol:
    name: ${ORG_NAME}-peer-1-vol
