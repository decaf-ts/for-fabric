  org-peer-0:
    container_name: ${ORG_NAME}-peer-0
    hostname: ${ORG_NAME}-peer-0
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - peer-0
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    environment:
      - SOFTHSM2_CONF=/var/lib/softhsm/softhsm2.conf
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric/ca
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/ca/msp
      - FABRIC_LOGGING_SPEC=gateway=debug:comm=debug:grpc=debug
    labels:
      - "pla_mah_index_name=${ORG_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - org-peer-0-vol:/etc/hyperledger/fabric:rw
      - org-peer-0-general-vol:/var/hyperledger:rw
      - org-contracts-vol:/etc/hyperledger/contract:rw
      - org-tls-shared-vol:/etc/hyperledger/shared:rw
      # - org-hsm-shared-vol:/var/lib/softhsm:rw
      - org-shared-vol:/tmp:rw
    networks:
      org_network:
    healthcheck:
      test: bash -c "[ -f /etc/hyperledger/fabric/ca/core.yaml ] && curl -s ${OPERATIONS_ADDRESS}/healthz | grep "OK" || exit 1"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: peer node start

  org-peer-1:
    container_name: ${ORG_NAME}-peer-1
    hostname: ${ORG_NAME}-peer-1
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - peer-1
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    environment:
      - SOFTHSM2_CONF=/var/lib/softhsm/softhsm2.conf
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric/ca
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/ca/msp
      - FABRIC_LOGGING_SPEC=gateway=debug:comm=debug:grpc=debug
    labels:
      - "pla_mah_index_name=${ORG_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - org-peer-1-vol:/etc/hyperledger/fabric:rw
      - org-peer-1-general-vol:/var/hyperledger:rw
      - org-contracts-vol:/etc/hyperledger/contract:rw
      - org-tls-shared-vol:/etc/hyperledger/shared:rw
      # - org-hsm-shared-vol:/var/lib/softhsm:rw
      - org-shared-vol:/tmp:rw

    networks:
      org_network:
    healthcheck:
      test: bash -c "[ -f /etc/hyperledger/fabric/ca/core.yaml ] && curl -s ${OPERATIONS_ADDRESS}/healthz | grep "OK" || exit 1"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: peer node start

  org-peer-2:
    container_name: ${ORG_NAME}-peer-2
    hostname: ${ORG_NAME}-peer-2
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - peer-2
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    environment:
      - SOFTHSM2_CONF=/var/lib/softhsm/softhsm2.conf
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric/ca
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/ca/msp
    labels:
      - "pla_mah_index_name=${ORG_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - org-peer-2-vol:/etc/hyperledger/fabric:rw
      - org-peer-2-general-vol:/var/hyperledger:rw
      - org-contracts-vol:/etc/hyperledger/contract:rw
      - org-tls-shared-vol:/etc/hyperledger/shared:rw
      # - org-hsm-shared-vol:/var/lib/softhsm:rw
      - org-shared-vol:/tmp:rw

    networks:
      org_network:
    healthcheck:
      test: bash -c "[ -f /etc/hyperledger/fabric/ca/core.yaml ] && curl -s ${OPERATIONS_ADDRESS}/healthz | grep "OK" || exit 1"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: peer node start

  org-ccaas:
    container_name: ${ORG_NAME}-ccaas-${CONTRACT_NAME}
    hostname: ${ORG_NAME}-ccaas-${CONTRACT_NAME}
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - ccaas
    volumes:
      - org-ccaas-tls-vol:/opt/hyperledger/tls:rw
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:${PORT:-9999}
      - CHAINCODE_ID=${PACKAGE_ID:-none}
      - CHAINCODE_TLS_CERT=/opt/hyperledger/tls/tls-client-cert.pem
      - CHAINCODE_TLS_KEY=/opt/hyperledger/tls/tls-client-key.pem
      - CORE_CHAINCODE_LOGGING_LEVEL=${LOG_LEVEL:-debug}
      - CORE_CHAINCODE_LOGGING_SHIM=${LOG_LEVEL:-debug}
      - CHAINCODE_MAXRECVMSGSIZE=${CHAINCODE_MAXRECVMSGSIZE:-15728640}
      - CHAINCODE_MAXSENDMSGSIZE=${CHAINCODE_MAXSENDMSGSIZE:-15728640}
      # - CORE_PEER_LOCALMSPID=${CORE_PEER_LOCALMSPID}
    networks:
      org_network:
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "grpc_health_probe",
    #       "-addr=:${PORT:-9999}",
    #       "-connect_timeout=5s",
    #       "-rpc_timeout=5s",
    #     ]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 5s
    command: npm run start

  org-ccaas-on-prem:
    container_name: ${ORG_NAME}-ccaas-${CONTRACT_NAME}
    hostname: ${ORG_NAME}-ccaas-${CONTRACT_NAME}
    image: ${IMAGE:-none}
    restart: unless-stopped
    profiles:
      - ccaas-on-prem
    volumes:
      - org-ccaas-tls-vol:/opt/hyperledger/tls:rw
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:${PORT:-9999}
      - CHAINCODE_ID=${PACKAGE_ID:-none}
      - CHAINCODE_TLS_CERT=/opt/hyperledger/tls/tls-client-cert.pem
      - CHAINCODE_TLS_KEY=/opt/hyperledger/tls/tls-client-key.pem
      - CORE_CHAINCODE_LOGGING_LEVEL=${LOG_LEVEL:-debug}
      - CORE_CHAINCODE_LOGGING_SHIM=${LOG_LEVEL:-debug}
      - CHAINCODE_MAXRECVMSGSIZE=${CHAINCODE_MAXRECVMSGSIZE:-15728640}
      - CHAINCODE_MAXSENDMSGSIZE=${CHAINCODE_MAXSENDMSGSIZE:-15728640}
      # - CORE_PEER_LOCALMSPID=${CORE_PEER_LOCALMSPID}
    networks:
      org_network:
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${PORT:-9999}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    command: npm run start

